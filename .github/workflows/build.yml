name: node image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - "node_agent/**"
      - "vendor/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. v0.1.0)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zagrosgm/zagros-node

jobs:
  build:
    runs-on: ubuntu-latest
    # amd64-only on purpose: the pinned accel-ppp (PPTP) engine and the PPP
    # package manifest are validated for amd64, exactly like the panel image.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ZAGROS_NODE_VERSION=${{ github.ref_name }}

      - name: Smoke-test the image
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name smoke --network host \
            -e ZAGROS_NODE_PORT=62050 -e ZAGROS_NODE_API_PORT=62051 \
            -e ZAGROS_NODE_REGISTRATION_HASH=$(printf test-token | sha256sum | cut -d' ' -f1) \
            -v /tmp/smoke-data:/var/lib/zagros \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:62051/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:62051/fingerprint
          docker rm -f smoke
